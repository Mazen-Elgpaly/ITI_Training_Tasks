<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recipe Finder | Forkify</title>

    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <header class="text-center mb-4">
        <h1 class="fw-bold text-warning mb-2">Recipe Finder</h1>

        <p class="text-secondary fs-5">
          Discover delicious recipes from around the world
        </p>
      </header>

      <div class="row g-3 justify-content-center mb-4">
        <div class="col-12 col-md-7">
          <input
            type="text"
            id="searchInput"
            class="form-control form-control-lg rounded-pill"
            placeholder="Search for a recipe... (e.g., pizza)"
          />
        </div>

        <div class="col-12 col-md-5">
          <select
            id="userSelect"
            class="form-select form-select-lg rounded-pill"
          >
            <option value="">-- Choose a category --</option>
          </select>
        </div>
      </div>

      <div id="dataRow" class="row g-4"></div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
